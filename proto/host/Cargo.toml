[package]
name = "samishisa-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
wasmtime = { version = "50", default-features = false, features = [
  "runtime", "std", "cranelift", "component-model", "async", "pooling-allocator", "anyhow",
] }
wasmtime-wasi = { version = "50", default-features = false }
