# docker compose up -d                       samishisa on http://localhost:3000 (config in ./config)
# REDIS_URL=redis://redis:6379 docker compose --profile redis up -d    also starts Redis for shared limits and cache
#
# Without ./config/api.config.json it serves the built-in example. `samishisa init config` creates one.
services:
  samishisa:
    image: ghcr.io/heyngra/samishisa:latest
    ports: ["${PORT:-3000}:3000"]
    volumes:
      - ./config:/config
      - samishisa-data:/data
    environment:
      REDIS_URL: ${REDIS_URL:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped

volumes:
  samishisa-data:
