[package]
name = "samishisa-server"
description = "The samishisa API server: one binary that serves sandboxed WebAssembly extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "samishisa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "cranelift", "component-model", "async", "pooling-allocator", "anyhow"] }
wasmtime-wasi = { version = "50", default-features = false }
