[package]
name = "samishisa-server"
description = "The samishisa API server: one binary that serves sandboxed WebAssembly extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "samishisa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
flate2 = "1.1.10"
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.60", default-features = false }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "cranelift", "component-model", "async", "pooling-allocator", "anyhow"] }
wasmtime-wasi = { version = "50", default-features = false }
webpki-roots = "1.0.11"

[dev-dependencies]
tempfile = "3.27.0"
