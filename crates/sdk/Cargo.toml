[package]
name = "samishisa"
description = "Write extensions for the samishisa API server: typed routes compiled to a sandboxed WebAssembly component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["api", "wasm", "plugin", "extension", "server"]
categories = ["wasm", "web-programming::http-server"]
include = ["src/**", "wit/**", "Cargo.toml", "README.md"]

[dependencies]
samishisa-macros.workspace = true
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wit-bindgen = "0.63"

[package.metadata.docs.rs]
targets = ["wasm32-wasip2"]

[lints]
workspace = true
