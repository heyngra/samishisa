[workspace]
resolver = "3"
members = ["crates/server", "crates/sdk", "crates/macros", "examples/hello"]
default-members = ["crates/server", "crates/macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyngra/samishisa"
rust-version = "1.88"

[workspace.dependencies]
samishisa = { path = "crates/sdk", version = "0.1.0" }
samishisa-macros = { path = "crates/macros", version = "0.1.0" }

[profile.release]
debug = false
strip = true

[profile.release.package.hello]
opt-level = "s"
