[workspace]
resolver = "3"
members = ["crates/server", "crates/sdk", "crates/macros", "examples/hello", "tests/probe"]
default-members = ["crates/server", "crates/macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyngra/samishisa"
rust-version = "1.88"

[workspace.dependencies]
samishisa = { path = "crates/sdk", version = "0.1.0" }
samishisa-macros = { path = "crates/macros", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = false
strip = true

[profile.release.package.hello]
opt-level = "s"
